name: Build and Push Docker Image

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILD_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

jobs:
  build-and-push:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare public Vite build configuration
        id: config
        env:
          PUBLIC_BUILD_ENV: ${{ env.BUILD_BRANCH == 'main' && vars.DOCKER_BUILD_ENV_MAIN || vars.DOCKER_BUILD_ENV_DEVELOP }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const config = JSON.parse(process.env.PUBLIC_BUILD_ENV || '{}');
          if (!config || Array.isArray(config) || typeof config !== 'object') throw new Error('Public Docker build configuration must be a JSON object.');
          for (const [key, value] of Object.entries(config)) {
            if (!/^VITE_[A-Z0-9_]+$/.test(key) || typeof value !== 'string' || !value.trim() || /[\r\n\0]/.test(value)) {
              throw new Error('Only nonempty public VITE_ string variables are supported.');
            }
          }
          const required = ['VITE_APP_BACKEND', 'VITE_AUTH_SERVICE_BACKEND', 'VITE_WORKBENCH_URL'];
          for (const key of required) {
            const url = new URL(config[key]);
            if (url.protocol !== 'https:') throw new Error(`${key} must be an absolute HTTPS URL.`);
            if (process.env.BUILD_BRANCH === 'main' && url.hostname.startsWith('pre.')) throw new Error('Production Docker builds must not target pre.');
          }
          if (config.VITE_TURNSTILE_ENABLED?.trim().toLowerCase() !== 'false' && !config.VITE_CLOUDFLARE_SITE_KEY?.trim()) {
            throw new Error('A public Turnstile site key is required when verification is enabled.');
          }
          const text = Object.entries(config).sort(([a], [b]) => a.localeCompare(b)).map(([key, value]) => `${key}=${JSON.stringify(value)}`).join('\n') + '\n';
          writeFileSync('.env.docker-build', text, { mode: 0o600 });
          appendFileSync(process.env.GITHUB_OUTPUT, `digest=${createHash('sha256').update(text).digest('hex')}\n`);
          JS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.BUILD_BRANCH }}
            type=raw,value=latest,enable=${{ env.BUILD_BRANCH == 'main' && github.event_name != 'pull_request' }}
            type=sha,prefix=${{ env.BUILD_BRANCH }}-,format=long
            type=sha,prefix=,format=long,enable=${{ env.BUILD_BRANCH == 'main' && github.event_name != 'pull_request' }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.BUILD_BRANCH }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILD_BRANCH }}
          build-args: BUILD_CONFIG_DIGEST=${{ steps.config.outputs.digest }}
          secret-files: vite_env=.env.docker-build

      - name: Verify published manifest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Summarize published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            printf '### Published Docker image\n\n```text\n%s\n```\n\nDigest: `%s`\n' "$IMAGE_TAGS" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
